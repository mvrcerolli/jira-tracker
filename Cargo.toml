[package]
name = "jt"
version = "0.3.1"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
crossterm = "0.29.0"
dirs = "7.0.0"
open = "5.4.5"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"

# TLS: rustls on Linux/macOS, Windows' built-in TLS (SChannel) on Windows.
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[profile.release]
strip = true
lto = true
